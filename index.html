<!--
  ==============================================================================
  Nazwa aplikacji: BREAK TIMER (Wersja 1.0)
  Opis funkcjonalności:
  - Minimalistyczna aplikacja typu PWA/Web App zoptymalizowana pod 
    ekrany AMOLED (motyw Pure Black #000000) oraz układy smartfonów (np. OnePlus 13 
    z uwzględnieniem bezpiecznych obszarów wycięcia na aparat i gestów systemowych).
  - Obsługa dwóch głównych trybów: Praca oraz Przerwa, z możliwością pełnej 
    konfiguracji czasów z dokładnością do 1 sekundy (ręczne wpisywanie lub 
    przyciski szybkiej regulacji krokowej).
  - Predefiniowane przyciski szybkiego wyboru (Presety):
    * Praca: 30 min, 45 min, 60 min (skok regulacji +/- 5 min).
    * Przerwa: 0 min (tryb stopera liczącego w górę do momentu zatrzymania), 
	  2 min, 3 min, 5 min, 10 min, 
      (skok regulacji +/- 30 s).
  - Wizualny wskaźnik postępu: duży, czytelny okrąg SVG, którego obwód płynnie 
    skraca się w miarę upływu czasu.
  - Automatyczna pętla pracy i przerw oraz funkcje w locie: dodawanie czasu (+2m, +5m)
    podczas odliczania oraz dedykowany przycisk natychmiastowego przejścia do przerwy.
  - Powiadomienia dźwiękowe (Web Audio API - łagodny gong) oraz systemowe 
    powiadomienia Androida / API Wake Lock zapewniające poprawne działanie 
    w tle oraz przy wygaszonym ekranie.
  ==============================================================================
-->

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BREAK TIMER</title>
	<link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            padding-left: 16px;
            padding-right: 16px;
            overflow-x: hidden;
        }

        header {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
        }

        .status-badge {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 6px;
            letter-spacing: 1px;
            text-align: center;
        }
        .status-work { color: #3b82f6; }
        .status-break { color: #10b981; }
        .status-alarm { color: #ef4444; }

        /* Tarcza odliczania SVG */
        .dial-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto 0;
        }

        .dial-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .dial-bg {
            fill: none;
            stroke: #181818;
            stroke-width: 8;
        }

        .dial-progress {
            fill: none;
            stroke: #3b82f6;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 816.8; /* 2 * PI * 130 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.2s linear, stroke 0.3s ease;
        }

        .time-display {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .time-text {
            font-size: 3.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .time-sub {
            font-size: 0.9rem;
            color: #777;
            margin-top: -4px;
            letter-spacing: 0.5px;
        }

        /* Sekcja konfiguracji Pracy i Przerwy */
        .setup-section {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .config-card {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 12px 14px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 25% jaśniejszy nagłówek dla lepszej czytelności */
        .config-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Wiersz wprowadzania czasu i przycisków +/- */
        .adjuster-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-step {
            flex: 0 0 68px;
            height: 52px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #2e2e2e;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .btn-step:active {
            background-color: #333;
        }

        .manual-input-box {
            flex: 1;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141414;
            border: 1px solid #282828;
            border-radius: 12px;
            padding: 0 4px;
        }

        .manual-input-box input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.65rem;
            font-weight: 700;
            width: 58px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            outline: none;
        }

        .manual-input-box span {
            color: #666;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 2px;
        }

        /* Siatka przycisków pracy (3 kolumny) */
        .preset-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* Siatka przycisków przerwy (wiersz 1: 2 kolumny, wiersz 2: 3 kolumny) */
        .break-row-1 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .break-row-2 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-preset {
            height: 46px;
            background: #181818;
            border: 1px solid #2a2a2a;
            color: #bbb;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .btn-preset:active {
            background: #2a2a2a;
            color: #fff;
        }

        .btn-preset.active-work {
            border-color: #3b82f6;
            color: #60a5fa;
            background: #172554;
        }

        .btn-preset.active-break {
            border-color: #10b981;
            color: #34d399;
            background: #064e3b;
        }

        /* Przyciski szybkiego dodawania czasu w locie */
        .quick-add-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 8px;
        }

        .btn-quick {
            flex: 1;
            height: 50px;
            background-color: #121212;
            border: 1px solid #262626;
            color: #bbb;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            touch-action: manipulation;
        }

        .btn-quick:active {
            background-color: #222;
            color: #fff;
        }

        /* Przycisk natychmiastowej przerwy podczas pracy */
        #breakNowContainer {
            width: 100%;
            max-width: 380px;
            margin-bottom: 8px;
            display: none;
        }

        .btn-break-now {
            width: 100%;
            height: 50px;
            background-color: #042f2e;
            border: 1px solid #10b981;
            color: #34d399;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        .btn-break-now:active {
            background-color: #064e3b;
            color: #fff;
        }

        /* Główne przyciski kontroli */
        .main-controls {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 380px;
        }

        .btn-main {
            flex: 1;
            height: 58px;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 700;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }

        .btn-start { background-color: #2563eb; color: #fff; }
        .btn-pause { background-color: #d97706; color: #fff; }
        .btn-stop  { background-color: #1c1c1c; color: #888; border: 1px solid #333; }
        .btn-break { background-color: #059669; color: #fff; }

        .btn-main:active { filter: brightness(1.2); }
    </style>
</head>
<body>

    <header>BREAK TIMER</header>

    <div>
        <div id="statusBadge" class="status-badge status-work">PRACA</div>
    </div>

    <!-- Tarcza zegara -->
    <div class="dial-container">
        <svg class="dial-svg" viewBox="0 0 280 280">
            <circle class="dial-bg" cx="140" cy="140" r="130"></circle>
            <circle id="dialProgress" class="dial-progress" cx="140" cy="140" r="130"></circle>
        </svg>
        <div class="time-display">
            <div id="timeText" class="time-text">45:00</div>
            <div id="timeSub" class="time-sub">GOTOWY</div>
        </div>
    </div>

    <!-- Sekcja konfiguracji obu trybów (widoczna w IDLE) -->
    <div id="setupSection" class="setup-section">
        
        <!-- Karta Pracy -->
        <div class="config-card">
            <div class="config-header">
                <span class="config-title">Czas Pracy (MM:SS)</span>
            </div>
            <div class="adjuster-row">
                <button class="btn-step" onclick="adjustWorkTime(-300)">-5m</button>
                <div class="manual-input-box">
                    <input type="text" id="inputMin" maxlength="3" value="45" onchange="manualWorkInputChanged()">
                    <span>:</span>
                    <input type="text" id="inputSec" maxlength="2" value="00" onchange="manualWorkInputChanged()">
                </div>
                <button class="btn-step" onclick="adjustWorkTime(300)">+5m</button>
            </div>
            <div class="preset-grid-3">
                <button class="btn-preset" onclick="setWorkPreset(1800, this)">30 min</button>
                <button class="btn-preset active-work" onclick="setWorkPreset(2700, this)">45 min</button>
                <button class="btn-preset" onclick="setWorkPreset(3600, this)">60 min</button>
            </div>
        </div>

        <!-- Karta Przerwy -->
        <div class="config-card">
            <div class="config-header">
                <span class="config-title">Czas Przerwy (MM:SS)</span>
            </div>
            <div class="adjuster-row">
                <button class="btn-step" onclick="adjustBreakTime(-30)">-30s</button>
                <div class="manual-input-box">
                    <input type="text" id="breakInputMin" maxlength="3" value="00" onchange="manualBreakInputChanged()">
                    <span>:</span>
                    <input type="text" id="breakInputSec" maxlength="2" value="00" onchange="manualBreakInputChanged()">
                </div>
                <button class="btn-step" onclick="adjustBreakTime(30)">+30s</button>
            </div>

            <!-- Rząd 1: 0 min (Stoper) i 5 min -->
            <div class="break-row-1">
                <button class="btn-preset active-break" onclick="setBreakPreset(0, this)">0 min (Stoper)</button>
                <button class="btn-preset" onclick="setBreakPreset(300, this)">5 min</button>
            </div>

            <!-- Rząd 2: 2 min, 3 min, 10 min -->
            <div class="break-row-2">
                <button class="btn-preset" onclick="setBreakPreset(120, this)">2 min</button>
                <button class="btn-preset" onclick="setBreakPreset(180, this)">3 min</button>
                <button class="btn-preset" onclick="setBreakPreset(600, this)">10 min</button>
            </div>
        </div>

    </div>

    <!-- Przyciski szybkiego dodawania czasu w locie -->
    <div class="quick-add-group">
        <button class="btn-quick" onclick="addSeconds(120)">+2 min</button>
        <button class="btn-quick" onclick="addSeconds(300)">+5 min</button>
    </div>

    <!-- Przycisk przejścia do przerwy przed czasem (widoczny podczas pracy) -->
    <div id="breakNowContainer">
        <button class="btn-break-now" onclick="triggerImmediateBreak()">Przerwa teraz</button>
    </div>

    <!-- Główne przyciski kontroli -->
    <div class="main-controls">
        <button id="btnAction" class="btn-main btn-start" onclick="handlePrimaryAction()">Start</button>
        <button id="btnSecondary" class="btn-main btn-stop" onclick="handleSecondaryAction()">Reset</button>
    </div>

    <script>
        const CIRCUMFERENCE = 2 * Math.PI * 130; // 816.81

        const DEFAULT_WORK_SEC = 45 * 60;
        const DEFAULT_BREAK_SEC = 0;

        let state = 'IDLE';
        let workDurationSec = DEFAULT_WORK_SEC;
        let breakTargetDurationSec = DEFAULT_BREAK_SEC;
        let currentRemainingSec = DEFAULT_WORK_SEC;
        let totalSpanSec = DEFAULT_WORK_SEC;

        let breakCountUpSec = 0;
        let lastTimestamp = null;
        let intervalId = null;
        let wakeLock = null;

        const statusBadge = document.getElementById('statusBadge');
        const dialProgress = document.getElementById('dialProgress');
        const timeText = document.getElementById('timeText');
        const timeSub = document.getElementById('timeSub');
        const inputMin = document.getElementById('inputMin');
        const inputSec = document.getElementById('inputSec');
        const breakInputMin = document.getElementById('breakInputMin');
        const breakInputSec = document.getElementById('breakInputSec');
        const setupSection = document.getElementById('setupSection');
        const breakNowContainer = document.getElementById('breakNowContainer');
        const btnAction = document.getElementById('btnAction');
        const btnSecondary = document.getElementById('btnSecondary');

        // Web Audio API
        let audioCtx = null;
        function playGentleSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(440.00, now + 0.18); // A4

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 1.2);

                if ('vibrate' in navigator) {
                    navigator.vibrate([200, 100, 200]);
                }
            } catch (err) {
                console.log('Audio playback error:', err);
            }
        }

        // Screen Wake Lock API
        async function requestWakeLock() {
            if ('wakeLock' in navigator && !wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (e) {
                    console.log('Wake Lock error:', e);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function sendNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    new Notification(title, {
                        body: body,
                        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%233b82f6"/></svg>'
                    });
                } catch (e) {
                    console.log('Notification error:', e);
                }
            }
        }

        function formatDisplay(totalSec) {
            const m = Math.floor(Math.abs(totalSec) / 60);
            const s = Math.floor(Math.abs(totalSec) % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateUI() {
            if (state === 'IDLE') {
                statusBadge.textContent = 'PRACA';
                statusBadge.className = 'status-badge status-work';
                dialProgress.style.stroke = '#3b82f6';
                dialProgress.style.strokeDashoffset = '0';
                timeText.textContent = formatDisplay(workDurationSec);
                timeSub.textContent = 'GOTOWY';

                setupSection.style.display = 'flex';
                breakNowContainer.style.display = 'none';

                btnAction.textContent = 'Start';
                btnAction.className = 'btn-main btn-start';
                btnSecondary.textContent = 'Reset';
                btnSecondary.className = 'btn-main btn-stop';

            } else if (state === 'RUNNING_WORK' || state === 'PAUSED_WORK') {
                statusBadge.textContent = 'PRACA';
                statusBadge.className = 'status-badge status-work';
                dialProgress.style.stroke = '#3b82f6';
                timeText.textContent = formatDisplay(currentRemainingSec);
                timeSub.textContent = state === 'RUNNING_WORK' ? 'W TOKU' : 'PAUZA';

                setupSection.style.display = 'none';
                breakNowContainer.style.display = 'block';

                const progress = totalSpanSec > 0 ? (currentRemainingSec / totalSpanSec) : 0;
                dialProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, progress)));

                btnAction.textContent = state === 'RUNNING_WORK' ? 'Pauza' : 'Wznów';
                btnAction.className = state === 'RUNNING_WORK' ? 'btn-main btn-pause' : 'btn-main btn-start';
                btnSecondary.textContent = 'Reset';
                btnSecondary.className = 'btn-main btn-stop';

            } else if (state === 'ALARM_WORK') {
                statusBadge.textContent = 'KONIEC CZASU!';
                statusBadge.className = 'status-badge status-alarm';
                dialProgress.style.stroke = '#ef4444';
                dialProgress.style.strokeDashoffset = String(CIRCUMFERENCE);
                timeText.textContent = '00:00';
                timeSub.textContent = 'CZAS NA PRZERWĘ';

                setupSection.style.display = 'none';
                breakNowContainer.style.display = 'none';

                btnAction.textContent = 'Przerwa';
                btnAction.className = 'btn-main btn-break';
                btnSecondary.textContent = 'Pomiń';
                btnSecondary.className = 'btn-main btn-stop';

            } else if (state === 'RUNNING_BREAK' || state === 'PAUSED_BREAK') {
                statusBadge.textContent = 'PRZERWA';
                statusBadge.className = 'status-badge status-break';
                dialProgress.style.stroke = '#10b981';

                setupSection.style.display = 'none';
                breakNowContainer.style.display = 'none';

                if (breakTargetDurationSec === 0) {
                    timeText.textContent = formatDisplay(breakCountUpSec);
                    timeSub.textContent = state === 'RUNNING_BREAK' ? 'STOPER (OD 0s)' : 'PAUZA';
                    dialProgress.style.strokeDashoffset = '0';
                    btnSecondary.textContent = 'Koniec przerwy';
                } else {
                    timeText.textContent = formatDisplay(currentRemainingSec);
                    timeSub.textContent = state === 'RUNNING_BREAK' ? 'W TOKU' : 'PAUZA';
                    const progress = totalSpanSec > 0 ? (currentRemainingSec / totalSpanSec) : 0;
                    dialProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, progress)));
                    btnSecondary.textContent = 'Zakończ';
                }

                btnAction.textContent = state === 'RUNNING_BREAK' ? 'Pauza' : 'Wznów';
                btnAction.className = state === 'RUNNING_BREAK' ? 'btn-main btn-pause' : 'btn-main btn-break';
                btnSecondary.className = 'btn-main btn-stop';

            } else if (state === 'ALARM_BREAK') {
                statusBadge.textContent = 'KONIEC PRZERWY';
                statusBadge.className = 'status-badge status-alarm';
                dialProgress.style.stroke = '#ef4444';
                dialProgress.style.strokeDashoffset = String(CIRCUMFERENCE);
                timeText.textContent = '00:00';
                timeSub.textContent = 'WRÓĆ DO PRACY';

                breakNowContainer.style.display = 'none';
                btnAction.textContent = 'Start Praca';
                btnAction.className = 'btn-main btn-start';
                btnSecondary.textContent = 'Reset';
                btnSecondary.className = 'btn-main btn-stop';
            }
        }

        // Pętla zegara
        function startLoop() {
            if (intervalId) clearInterval(intervalId);
            lastTimestamp = performance.now();
            intervalId = setInterval(tick, 200);
            requestWakeLock();
        }

        function stopLoop() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            releaseWakeLock();
        }

        function tick() {
            const now = performance.now();
            const deltaSec = (now - lastTimestamp) / 1000;
            lastTimestamp = now;

            if (state === 'RUNNING_WORK') {
                currentRemainingSec -= deltaSec;
                if (currentRemainingSec <= 0) {
                    currentRemainingSec = 0;
                    stopLoop();
                    state = 'ALARM_WORK';
                    playGentleSound();
                    sendNotification('TIMER: Praca zakończona', 'Czas na przerwę.');
                }
                updateUI();
            } else if (state === 'RUNNING_BREAK') {
                if (breakTargetDurationSec === 0) {
                    breakCountUpSec += deltaSec;
                } else {
                    currentRemainingSec -= deltaSec;
                    if (currentRemainingSec <= 0) {
                        currentRemainingSec = 0;
                        stopLoop();
                        playGentleSound();
                        sendNotification('TIMER: Przerwa zakończona', 'Rozpoczynam kolejny cykl pracy.');
                        startWorkCycle();
                        return;
                    }
                }
                updateUI();
            }
        }

        function handlePrimaryAction() {
            requestNotificationPermission();

            if (state === 'IDLE') {
                totalSpanSec = workDurationSec;
                currentRemainingSec = workDurationSec;
                state = 'RUNNING_WORK';
                startLoop();
            } else if (state === 'RUNNING_WORK') {
                state = 'PAUSED_WORK';
                stopLoop();
            } else if (state === 'PAUSED_WORK') {
                state = 'RUNNING_WORK';
                startLoop();
            } else if (state === 'ALARM_WORK') {
                startBreakCycle();
            } else if (state === 'RUNNING_BREAK') {
                state = 'PAUSED_BREAK';
                stopLoop();
            } else if (state === 'PAUSED_BREAK') {
                state = 'RUNNING_BREAK';
                startLoop();
            } else if (state === 'ALARM_BREAK') {
                startWorkCycle();
            }
            updateUI();
        }

        function handleSecondaryAction() {
            if (state === 'RUNNING_WORK' || state === 'PAUSED_WORK') {
                resetToIdle();
            } else if (state === 'ALARM_WORK') {
                startWorkCycle();
            } else if (state === 'RUNNING_BREAK' || state === 'PAUSED_BREAK') {
                startWorkCycle();
            } else if (state === 'IDLE') {
                resetToDefaults();
            }
            updateUI();
        }

        function triggerImmediateBreak() {
            stopLoop();
            startBreakCycle();
        }

        function startBreakCycle() {
            if (breakTargetDurationSec === 0) {
                breakCountUpSec = 0;
            } else {
                currentRemainingSec = breakTargetDurationSec;
                totalSpanSec = breakTargetDurationSec;
            }
            state = 'RUNNING_BREAK';
            startLoop();
            updateUI();
        }

        function startWorkCycle() {
            currentRemainingSec = workDurationSec;
            totalSpanSec = workDurationSec;
            state = 'RUNNING_WORK';
            startLoop();
            updateUI();
        }

        function resetToIdle() {
            stopLoop();
            state = 'IDLE';
            currentRemainingSec = workDurationSec;
            totalSpanSec = workDurationSec;
            updateUI();
        }

        function resetToDefaults() {
            stopLoop();
            state = 'IDLE';
            workDurationSec = DEFAULT_WORK_SEC;
            breakTargetDurationSec = DEFAULT_BREAK_SEC;
            currentRemainingSec = DEFAULT_WORK_SEC;
            totalSpanSec = DEFAULT_WORK_SEC;

            inputMin.value = '45';
            inputSec.value = '00';
            breakInputMin.value = '00';
            breakInputSec.value = '00';

            document.querySelectorAll('.preset-grid-3 .btn-preset').forEach((b, idx) => {
                b.classList.toggle('active-work', idx === 1); // 45 min
            });
            document.querySelectorAll('.break-row-1 .btn-preset, .break-row-2 .btn-preset').forEach(b => {
                b.classList.remove('active-break');
            });
            document.querySelector('.break-row-1 .btn-preset').classList.add('active-break'); // 0 min

            updateUI();
        }

        // Regulacja Pracy (+/- 5 min)
        function adjustWorkTime(seconds) {
            if (state !== 'IDLE') return;
            let newSec = workDurationSec + seconds;
            if (newSec < 1) newSec = 1;
            if (newSec > 5999) newSec = 5999;
            workDurationSec = newSec;
            currentRemainingSec = newSec;
            totalSpanSec = newSec;

            inputMin.value = Math.floor(newSec / 60);
            inputSec.value = String(newSec % 60).padStart(2, '0');
            clearPresetSelection('work');
            updateUI();
        }

        function manualWorkInputChanged() {
            let m = parseInt(inputMin.value) || 0;
            let s = parseInt(inputSec.value) || 0;
            if (m < 0) m = 0;
            if (s < 0) s = 0;
            if (s > 59) s = 59;
            let total = m * 60 + s;
            if (total < 1) total = 1;

            workDurationSec = total;
            currentRemainingSec = total;
            totalSpanSec = total;

            inputMin.value = m;
            inputSec.value = String(s).padStart(2, '0');
            clearPresetSelection('work');
            updateUI();
        }

        // Regulacja Przerwy (+/- 30 s)
        function adjustBreakTime(seconds) {
            if (state !== 'IDLE') return;
            let newSec = breakTargetDurationSec + seconds;
            if (newSec < 0) newSec = 0;
            if (newSec > 3599) newSec = 3599;
            breakTargetDurationSec = newSec;

            breakInputMin.value = String(Math.floor(newSec / 60)).padStart(2, '0');
            breakInputSec.value = String(newSec % 60).padStart(2, '0');
            clearPresetSelection('break');
        }

        function manualBreakInputChanged() {
            let m = parseInt(breakInputMin.value) || 0;
            let s = parseInt(breakInputSec.value) || 0;
            if (m < 0) m = 0;
            if (s < 0) s = 0;
            if (s > 59) s = 59;
            let total = m * 60 + s;

            breakTargetDurationSec = total;
            breakInputMin.value = String(m).padStart(2, '0');
            breakInputSec.value = String(s).padStart(2, '0');
            clearPresetSelection('break');
        }

        // Presety Pracy
        function setWorkPreset(seconds, btnElement) {
            workDurationSec = seconds;
            currentRemainingSec = seconds;
            totalSpanSec = seconds;

            inputMin.value = Math.floor(seconds / 60);
            inputSec.value = String(seconds % 60).padStart(2, '0');

            document.querySelectorAll('.preset-grid-3 .btn-preset').forEach(b => b.classList.remove('active-work'));
            if (btnElement) btnElement.classList.add('active-work');
            updateUI();
        }

        // Presety Przerwy
        function setBreakPreset(seconds, btnElement) {
            breakTargetDurationSec = seconds;
            breakInputMin.value = String(Math.floor(seconds / 60)).padStart(2, '0');
            breakInputSec.value = String(seconds % 60).padStart(2, '0');

            document.querySelectorAll('.break-row-1 .btn-preset, .break-row-2 .btn-preset').forEach(b => b.classList.remove('active-break'));
            if (btnElement) btnElement.classList.add('active-break');
        }

        function clearPresetSelection(type) {
            if (type === 'work') {
                document.querySelectorAll('.preset-grid-3 .btn-preset').forEach(b => b.classList.remove('active-work'));
            } else {
                document.querySelectorAll('.break-row-1 .btn-preset, .break-row-2 .btn-preset').forEach(b => b.classList.remove('active-break'));
            }
        }

        // Dodawanie czasu (+2m, +5m) w locie
        function addSeconds(secToAdd) {
            if (state === 'RUNNING_WORK' || state === 'PAUSED_WORK') {
                currentRemainingSec += secToAdd;
                totalSpanSec += secToAdd;
            } else if (state === 'ALARM_WORK') {
                currentRemainingSec = secToAdd;
                totalSpanSec = secToAdd;
                state = 'RUNNING_WORK';
                startLoop();
            } else if (state === 'RUNNING_BREAK' || state === 'PAUSED_BREAK') {
                if (breakTargetDurationSec > 0) {
                    currentRemainingSec += secToAdd;
                    totalSpanSec += secToAdd;
                }
            } else if (state === 'IDLE') {
                adjustWorkTime(secToAdd);
            }
            updateUI();
        }

        // Widoczność ekranu / wybudzanie
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                lastTimestamp = performance.now();
                if (state === 'RUNNING_WORK' || state === 'RUNNING_BREAK') {
                    requestWakeLock();
                }
                updateUI();
            }
        });

        // Startowy stan UI
        updateUI();
    </script>
</body>
</html>
