<!--
  ==============================================================================
  Nazwa aplikacji: BREAK TIMER (Wersja 1.4.2 beta)
  - Minimalistyczna aplikacja typu PWA/Web App
  ==============================================================================
-->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BREAK TIMER</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        <header>BREAK TIMER</header>
        <div id="statusBadge" class="status-badge status-work">PRACA</div>
    </div>

    <!-- Tarcza zegara -->
    <div id="dialContainer" class="dial-container dial-compact">
        <svg class="dial-svg" viewBox="0 0 280 280">
            <circle class="dial-bg" cx="140" cy="140" r="130"></circle>
            <circle id="dialProgress" class="dial-progress" cx="140" cy="140" r="130"></circle>
        </svg>
        <div class="time-display">
            <div id="timeText" class="time-text">40:00</div>
            <div id="timeSub" class="time-sub">GOTOWY</div>
        </div>
    </div>

    <!-- Środkowa część układu -->
    <div class="middle-content">
        <!-- Sekcja konfiguracji (tylko w stanie IDLE) -->
        <div id="setupSection" class="setup-section">
            <!-- Karta Pracy -->
            <div class="config-card">
                <div class="config-header">
                    <span class="config-title">Czas Pracy (MM:SS)</span>
                </div>
                <div class="adjuster-row">
                    <button class="btn-step" onclick="adjustWorkTime(-300)">-5m</button>
                    <div class="manual-input-box">
                        <input type="text" id="inputMin" maxlength="3" value="40" onchange="manualWorkInputChanged()">
                        <span>:</span>
                        <input type="text" id="inputSec" maxlength="2" value="00" onchange="manualWorkInputChanged()">
                    </div>
                    <button class="btn-step" onclick="adjustWorkTime(300)">+5m</button>
                </div>
                <div class="preset-grid-3">
                    <button class="btn-preset" onclick="setWorkPreset(1800, this)">30 min</button>
                    <button class="btn-preset active-work" onclick="setWorkPreset(2400, this)">40 min</button>
                    <button class="btn-preset" onclick="setWorkPreset(3300, this)">55 min</button>
                </div>
            </div>

            <!-- Karta Przerwy -->
            <div class="config-card">
                <div class="config-header">
                    <span class="config-title">Czas Przerwy (MM:SS)</span>
                </div>
                <div class="adjuster-row">
                    <button class="btn-step" onclick="adjustBreakTime(-30)">-30s</button>
                    <div class="manual-input-box">
                        <input type="text" id="breakInputMin" maxlength="3" value="00" onchange="manualBreakInputChanged()">
                        <span>:</span>
                        <input type="text" id="breakInputSec" maxlength="2" value="00" onchange="manualBreakInputChanged()">
                    </div>
                    <button class="btn-step" onclick="adjustBreakTime(30)">+30s</button>
                </div>
                <div class="break-row-1">
                    <button class="btn-preset active-break" onclick="setBreakPreset(0, this)">0 min (Stoper)</button>
                    <button class="btn-preset" onclick="setBreakPreset(300, this)">5 min</button>
                </div>
                <div class="break-row-2">
                    <button class="btn-preset" onclick="setBreakPreset(120, this)">2 min</button>
                    <button class="btn-preset" onclick="setBreakPreset(180, this)">3 min</button>
                    <button class="btn-preset" onclick="setBreakPreset(600, this)">10 min</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Przyciski szybkiego dodawania czasu w locie -->
    <div id="quickAddGroup" class="quick-add-group">
        <button class="btn-quick" onclick="addSeconds(120)">+2 min</button>
        <button class="btn-quick" onclick="addSeconds(300)">+5 min</button>
    </div>

    <!-- Przycisk przejścia do przerwy przed czasem -->
    <div id="breakNowContainer">
        <button class="btn-break-now" onclick="triggerImmediateBreak()">Przerwa teraz</button>
    </div>

    <!-- Główne przyciski kontroli -->
    <div class="main-controls">
        <button id="btnAction" class="btn-main btn-start" onclick="handlePrimaryAction()">Start</button>
        <button id="btnSecondary" class="btn-main btn-reset" onclick="handleSecondaryAction()">Reset</button>
    </div>

    <!-- Skrypty oraz logika aplikacji -->
    <script src="script.js"></script>
</body>
</html>
